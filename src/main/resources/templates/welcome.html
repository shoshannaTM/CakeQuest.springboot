<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Login or Sign Up</title>
</head>
<body>
<main layout:fragment="content">
    <div class="centered-content">
    <div class="title-home">
        <h1>Welcome to CakeQuest!</h1>
        <p class="tagline">Let's bake something sweet!</p>

    <div class="login-img">
        <img src="/images/pngtreeWatercolorCakeOrange.png" alt="Watercolor Orange Cake" />
        <div>
            <a th:href="@{/signup}" class="btn btn--primary">Sign Up</a>
        </div>
        <div>
            <a th:href="@{/login}" class="btn btn--primary">Log In</a>
        </div>
    </div>
    </div>
    </div>
</main>
</body>
</html>
